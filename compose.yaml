services:
  machbar:
    build: .
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000'
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DAILY_HISTORY_DAYS: ${DAILY_HISTORY_DAYS:-3}
    volumes:
      - machbar_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
volumes:
  machbar_data:
