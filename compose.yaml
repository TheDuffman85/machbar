services:
  machbar:
    build: .
    restart: unless-stopped
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000'
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DAILY_HISTORY_DAYS: ${DAILY_HISTORY_DAYS:-3}
      DISABLE_USER_CREATION: ${DISABLE_USER_CREATION:-false}
      RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
      RATE_LIMIT_MAX_PER_IP: ${RATE_LIMIT_MAX_PER_IP:-300}
      RATE_LIMIT_MAX_PER_USER: ${RATE_LIMIT_MAX_PER_USER:-120}
      RATE_LIMIT_MAX_ANONYMOUS: ${RATE_LIMIT_MAX_ANONYMOUS:-20}
    volumes:
      - machbar_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Used only by the entrypoint; the application drops to UID/GID 1000:1000.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp
volumes:
  machbar_data:
